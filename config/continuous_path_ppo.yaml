# Experimental 47-observation continuous-path policy; four actuator actions.
# Initial scene uses short, weakly curved paths (0.06–0.20 m).
# This exploration run does not establish full loading-cycle performance.
# Keep the established 38-observation policy as the deployment baseline.
# Start a new run with tools/mlagents_train_no_onnx.py; no old-model resume.
behaviors:
  ExcavatorContinuousPath:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 10
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 5000

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
