# Long-run PPO training config for the scale excavator trajectory tracker.
#
# Use this only after config/trajectory_smoke.yaml has verified that Unity,
# rewards, episode reset, and TensorBoard stats are all working.
#
# Current contract:
#   behavior: ExcavatorTrajectory
#   observation: scale_excavator_v2_38d, 38 floats
#   action: 4 continuous values [boom, stick, bucket, swing]
#
# Usage:
#   python tools/mlagents_train_no_onnx.py config/trajectory_scale_long.yaml --run-id=scale_v2_long_01
#   Then press Play in Unity.
#
# Resume:
#   python tools/mlagents_train_no_onnx.py config/trajectory_scale_long.yaml --run-id=scale_v2_long_01 --resume
#
# Export after training:
#   python tools/mlagents_export_legacy_onnx.py config/trajectory_scale_long.yaml --run-id=scale_v2_long_01 --resume
#
# Do not resume older Cat365 or 31/37-dim checkpoints with this config.

behaviors:
  ExcavatorTrajectory:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    checkpoint_interval: 1000000
    keep_checkpoints: 10
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000

engine_settings:
  # Keep this moderate for AGX stability. You can override from CLI after a
  # stable run, for example: --time-scale=10
  time_scale: 5
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
