# ML-Agents smoke-test config for ExcavatorTrajectory.
#
# Purpose:
#   Use this after code changes to verify that Unity connects, episodes run,
#   rewards are computed, and TensorBoard stats are written.
#
# Not for final training:
#   The network and buffer are intentionally small. For real training, use
#   config/trajectory_ppo.yaml instead.
#
# Usage:
#   mlagents-learn config/trajectory_smoke.yaml --run-id=traj_smoke_$(date +%m%d_%H%M)
#   Then press Play in Unity.

behaviors:
  ExcavatorTrajectory:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # Keep this higher than max_steps so smoke tests do not repeatedly trigger
    # checkpoint export. Stop manually after several summaries if ONNX export is
    # not needed.
    checkpoint_interval: 1000000
    keep_checkpoints: 1

    max_steps: 50000
    time_horizon: 64
    summary_freq: 1000

engine_settings:
  # Keep smoke tests visually interpretable. Override from CLI if you only care
  # about speed, e.g. --time-scale=5.
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
