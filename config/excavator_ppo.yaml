# ML-Agents PPO 训练配置 —— 挖掘机挖土 demo
# 用法: mlagents-learn config/excavator_ppo.yaml --run-id=dig01
# 启动后回到 Unity 点 Play 开始训练；中断后加 --resume 续训。
#
# behavior 名字必须和场景里 Behavior Parameters 组件的 "Behavior Name" 完全一致。
behaviors:
  ExcavatorDig:
    trainer_type: ppo          # 先用 PPO(稳)；学不动再试 sac
    hyperparameters:
      batch_size: 2048         # 连续控制用较大 batch
      buffer_size: 20480       # = batch_size * 10 左右
      learning_rate: 3.0e-4
      beta: 5.0e-3             # 熵正则，鼓励探索
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true          # 连续控制强烈建议开（自动标准化观测）
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 2000000         # 先 2e6 试，看曲线再加
    time_horizon: 128
    summary_freq: 10000        # 每 1万步写一次 TensorBoard
