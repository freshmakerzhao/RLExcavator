# V5 continuation: same 47D inputs, original V5 reward, 70% rounded references.
# The isolated curve scene retains 30% original paths; no deployed model changes.
behaviors:
  ExcavatorContinuousPath:
    trainer_type: ppo
    init_path: /home/zhaoshuai/workspace_uinty/RL_prj/RLExcavator/results/continuous_path_v5_20261021_train/ExcavatorContinuousPath/ExcavatorContinuousPath-3000018.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 25000
    keep_checkpoints: 10
    max_steps: 500000
    time_horizon: 128
    summary_freq: 5000

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
