# PPO continuation for the deployment-focused policy candidate.
# Active training scene configuration:
#   A1: directional deadzone bump, weight 0.03, escape margin 10%
#   A2: energy uses post-deadzone effective action
#   A3: conservative PPO learning-rate and entropy annealing below
#   A4.1: each episode independently scales each axis deadzone by 0.8-1.2x
#
# A4.1 intentionally randomizes only the measured command deadzone. Speed, delay,
# hydraulic lag, and observation noise remain fixed so this run has a clear cause.
# Interface remains frozen: scale_excavator_v2_38d (38 observations, 4 actions).
#
# Start a fresh optimizer schedule while loading the latest A1+A2 checkpoint:
#   python tools/mlagents_train_no_onnx.py config/trajectory_ppo_deadzone_bump_dr.yaml \
#     --run-id=scale_v3_deadzone_bump_a1a2_dr01 \
#     --initialize-from=scale_v3_deadzone_bump_a1a2_01
#
# Deterministic gate after export: per-axis in-DZ < 0.05, aggregate < 0.15,
# SuccessRate >= 0.98, and FinalDistance not materially worse than the candidate.
behaviors:
  ExcavatorTrajectory:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.5e-4
      beta: 3.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 5000
