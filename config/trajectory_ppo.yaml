# ML-Agents PPO training config for bucket-tip trajectory tracking with
# task-conditioned bucket attitude.
# Usage:
#   python tools/mlagents_train_no_onnx.py config/trajectory_ppo.yaml --run-id=traj_smoke_01
# Use the wrapper for training so checkpoint saves do not try to export ONNX.
#
# The behavior name must match the Behavior Parameters component in Unity.
# The current scale-excavator observation contract is
# scale_excavator_v2_38d (38 observations, 4 continuous actions). Do not resume
# older 31/37-dim trajectory checkpoints with this config.
behaviors:
  ExcavatorTrajectory:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 5000
