# ML-Agents PPO training config for bucket-tip trajectory tracking with
# task-conditioned bucket attitude.
# Usage:
#   python tools/mlagents_train_no_onnx.py config/trajectory_ppo.yaml --run-id=traj_smoke_01
# Use the wrapper for training so checkpoint saves do not try to export ONNX.
#
# The behavior name must match the Behavior Parameters component in Unity.
# The observation shape remains 38 values and four continuous actions. Since
# 2026-09-28, the training scene uses cylinder extension-positive AGX axes;
# earlier 38-dim checkpoints have different action/observation semantics.
# Checkpoints from before that axis reversal are incompatible. After changing
# the actuator ranges and 3 cm reach criterion, initialize a new run from a
# checkpoint trained with the corrected axis direction; do not resume the old run.
behaviors:
  ExcavatorTrajectory:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 250000
    keep_checkpoints: 10
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
