# PPO config for deadzone-avoidance retrain.
# First reward experiment: A1 bump with 10% escape margin and raw-action energy.
# A2 energy-on-effective is implemented behind an Inspector switch but remains disabled,
# isolating A1 from A2. The conservative lr/beta restart below is A3, so this is an
# end-to-end improvement run rather than a strict optimizer-controlled reward ablation.
# Interface frozen: scale_excavator_v2_38d (38 obs, 4 continuous actions). Drop-in with
# the deploy pipeline — only the Unity reward changed, machine_profile contract untouched.
#
# Usage (init from the current deadzone checkpoint, do NOT --resume so lr/beta reset):
#   python tools/mlagents_train_no_onnx.py config/trajectory_ppo_deadzone_bump.yaml \
#     --run-id=scale_v3_deadzone_bump_a1_01 \
#     --initialize-from=scale_v3_deadzone_reward_03_p003
#   python tools/mlagents_export_legacy_onnx.py config/trajectory_ppo_deadzone_bump.yaml \
#     --run-id=scale_v3_deadzone_bump_a1_01 --resume
#
# Gate (deterministic ONNX + OpenLoopVelocityRecorder raw CSV): per-axis in-DZ < 0.05,
# aggregate < 0.15, while SuccessRate >= 0.98 and FinalDistance not worse than baseline.
behaviors:
  ExcavatorTrajectory:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.5e-4          # gentle: resuming an already-converged policy
      beta: 3.0e-3                    # A3: lower entropy than 5e-3 to sharpen the mean
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear          # A3: anneal exploration noise over training
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10              # retain every 500k checkpoint across the 5M run
    checkpoint_interval: 500000       # first deterministic ONNX gate at 500k
    max_steps: 5000000                # about 7.5-8h at the measured ~500k/45min throughput
    time_horizon: 128
    summary_freq: 5000
