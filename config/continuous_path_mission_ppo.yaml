# Mission 47D course: original arcs + physical ACT/dump handoff starts. Initialize from V4.
# Independent V5 scene/player; deployment 38D policy is unchanged.
# Endpoint sampling band is not an exact physical path-length bound.
behaviors:
  ExcavatorContinuousPath:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 10
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 5000

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
